name: publish-reviewed
on:
  push:
    branches: [main]
    paths: ['reviews/*.json']
permissions:
  contents: write
concurrency:
  group: publish-reviewed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Publish exact reviewed runner outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for review in $(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^reviews/[0-9]+\.json$'); do
            python3 ci/publish_reviewed.py "$review"
          done
